<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Recipe Book" />
  <meta name="theme-color" content="#FF6B35" />
  <title>My Recipe Book</title>
  <style>
    :root {
      --orange:   #FF6B35;
      --orange-dk:#E85A24;
      --cream:    #FFF8F3;
      --card-bg:  #FFFFFF;
      --text:     #1C1C1E;
      --subtext:  #6C6C70;
      --border:   #E5E5EA;
      --tag-bg:   #FFF0E8;
      --tag-txt:  #E85A24;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ── Nav bar ── */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(255, 248, 243, 0.85);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      padding-top: calc(var(--safe-top) + 12px);
      padding-bottom: 12px;
      padding-inline: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .navbar-title { font-size: 1.35rem; font-weight: 700; color: var(--orange); letter-spacing: -0.4px; }

    .btn-add {
      width: 36px; height: 36px;
      background: var(--orange);
      border: none; border-radius: 50%;
      color: #fff; font-size: 1.4rem; line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(255,107,53,.35);
      transition: transform .15s, background .15s;
    }
    .btn-add:active { transform: scale(.9); background: var(--orange-dk); }

    /* ── Main scroll area ── */
    .main {
      padding-top: calc(var(--safe-top) + 70px);
      padding-bottom: calc(var(--safe-bot) + 90px);
      padding-inline: 16px;
    }

    /* ── Search ── */
    .search-wrap { position: relative; margin-bottom: 16px; }
    .search-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 1rem; color: var(--subtext);
    }
    .search-input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      background: var(--card-bg);
      font-size: .95rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    .search-input:focus { border-color: var(--orange); }

    /* ── Category pills ── */
    .cats {
      display: flex; gap: 8px;
      overflow-x: auto; padding-bottom: 4px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }
    .cats::-webkit-scrollbar { display: none; }
    .cat-pill {
      flex-shrink: 0;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      font-size: .82rem; font-weight: 600;
      color: var(--subtext);
      cursor: pointer;
      transition: all .2s;
    }
    .cat-pill.active, .cat-pill:active {
      background: var(--orange); border-color: var(--orange); color: #fff;
    }

    /* ── Section header ── */
    .section-header {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 12px;
    }
    .section-title { font-size: 1.1rem; font-weight: 700; }
    .section-count { font-size: .82rem; color: var(--subtext); }

    /* ── Recipe grid ── */
    .recipe-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    /* ── Recipe card ── */
    .recipe-card {
      background: var(--card-bg);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      transition: transform .2s, box-shadow .2s;
      -webkit-touch-callout: none;
    }
    .recipe-card:active { transform: scale(.97); box-shadow: 0 1px 6px rgba(0,0,0,.06); }

    .card-img {
      width: 100%; aspect-ratio: 1 / 1;
      object-fit: cover;
      background: linear-gradient(135deg, #FFE0CC 0%, #FFB085 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem;
    }
    .card-body { padding: 10px 12px 12px; }
    .card-title { font-size: .9rem; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
    .card-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .card-time { font-size: .75rem; color: var(--subtext); }
    .card-tag {
      font-size: .68rem; font-weight: 600;
      background: var(--tag-bg); color: var(--tag-txt);
      padding: 2px 8px; border-radius: 20px;
    }

    .fav-btn {
      float: right;
      background: none; border: none;
      font-size: 1.1rem; cursor: pointer;
      margin-top: -2px;
      transition: transform .15s;
    }
    .fav-btn:active { transform: scale(1.3); }

    /* ── Bottom tab bar ── */
    .tabbar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(255, 248, 243, 0.92);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      padding-bottom: var(--safe-bot);
    }
    .tab {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 10px 0;
      cursor: pointer;
      color: var(--subtext);
      font-size: .68rem; font-weight: 600;
      gap: 3px;
      transition: color .2s;
    }
    .tab.active { color: var(--orange); }
    .tab-icon { font-size: 1.4rem; }

    /* ── Modal overlay ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.5);
      display: none; align-items: flex-end;
      animation: fadeIn .2s;
    }
    .modal-overlay.open { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ── Recipe detail sheet ── */
    .sheet {
      width: 100%;
      max-height: 92dvh;
      background: var(--card-bg);
      border-radius: 24px 24px 0 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      animation: slideUp .3s cubic-bezier(.25,.46,.45,.94);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .sheet-handle-wrap { padding: 12px 0 0; display: flex; justify-content: center; }
    .sheet-handle { width: 36px; height: 4px; background: #C7C7CC; border-radius: 2px; }

    .sheet-hero {
      width: 100%; aspect-ratio: 16/9;
      background: linear-gradient(135deg, #FFE0CC 0%, #FFB085 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 5rem;
    }
    .sheet-body { padding: 20px 20px calc(var(--safe-bot) + 24px); }
    .sheet-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .sheet-title { font-size: 1.4rem; font-weight: 800; flex: 1; letter-spacing: -0.3px; }
    .sheet-close {
      background: #F2F2F7; border: none; border-radius: 50%;
      width: 30px; height: 30px;
      font-size: .85rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--subtext); font-weight: 700; flex-shrink: 0; margin-left: 12px;
    }
    .sheet-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .sheet-tag {
      font-size: .78rem; font-weight: 600;
      background: var(--tag-bg); color: var(--tag-txt);
      padding: 4px 12px; border-radius: 20px;
    }
    .sheet-stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; margin-bottom: 20px;
    }
    .stat-box {
      background: var(--cream); border-radius: 14px;
      padding: 12px 8px; text-align: center;
    }
    .stat-value { font-size: 1.1rem; font-weight: 800; color: var(--orange); }
    .stat-label { font-size: .7rem; color: var(--subtext); margin-top: 2px; }

    .section-h { font-size: 1rem; font-weight: 700; margin-bottom: 10px; }
    .ingredients { list-style: none; margin-bottom: 20px; }
    .ingredients li {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      font-size: .9rem;
    }
    .ingredients li:last-child { border-bottom: none; }
    .ing-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--orange); flex-shrink: 0;
    }
    .ing-amount { color: var(--subtext); min-width: 60px; font-size: .82rem; }

    .steps { list-style: none; margin-bottom: 20px; }
    .steps li {
      display: flex; gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: .9rem; line-height: 1.5;
    }
    .steps li:last-child { border-bottom: none; }
    .step-num {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--orange); color: #fff;
      font-size: .78rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }

    /* ── Add recipe sheet ── */
    .add-sheet .sheet-body { display: flex; flex-direction: column; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: .82rem; font-weight: 600; color: var(--subtext); }
    .form-input, .form-textarea, .form-select {
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: .95rem;
      font-family: inherit;
      color: var(--text);
      background: var(--card-bg);
      outline: none;
      transition: border-color .2s;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--orange); }
    .form-textarea { resize: none; min-height: 80px; }
    .btn-submit {
      width: 100%; padding: 15px;
      background: var(--orange); color: #fff;
      border: none; border-radius: 14px;
      font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background .2s;
    }
    .btn-submit:active { background: var(--orange-dk); }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 48px 24px; color: var(--subtext); }
    .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-title { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .empty-sub { font-size: .87rem; }
  </style>
</head>
<body>

<!-- Nav bar -->
<header class="navbar">
  <span class="navbar-title">🍳 My Recipes</span>
  <button class="btn-add" onclick="openAdd()" aria-label="Add recipe">+</button>
</header>

<!-- Main content -->
<main class="main" id="mainContent">

  <!-- Search -->
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" type="search" placeholder="Search recipes…" oninput="renderRecipes()" />
  </div>

  <!-- Category pills -->
  <div class="cats" id="catBar"></div>

  <!-- Recipe list -->
  <div class="section-header">
    <span class="section-title" id="sectionTitle">All Recipes</span>
    <span class="section-count" id="sectionCount"></span>
  </div>
  <div class="recipe-grid" id="recipeGrid"></div>
</main>

<!-- Bottom tab bar -->
<nav class="tabbar">
  <div class="tab active" onclick="switchTab('home',this)">
    <span class="tab-icon">🏠</span>Home
  </div>
  <div class="tab" onclick="switchTab('favs',this)">
    <span class="tab-icon">❤️</span>Favorites
  </div>
  <div class="tab" onclick="switchTab('shopping',this)">
    <span class="tab-icon">🛒</span>Shopping
  </div>
  <div class="tab" onclick="switchTab('settings',this)">
    <span class="tab-icon">⚙️</span>Settings
  </div>
</nav>

<!-- Recipe detail modal -->
<div class="modal-overlay" id="detailModal" onclick="handleOverlayClick(event,'detailModal')">
  <div class="sheet" id="detailSheet"></div>
</div>

<!-- Add recipe modal -->
<div class="modal-overlay" id="addModal" onclick="handleOverlayClick(event,'addModal')">
  <div class="sheet add-sheet">
    <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
    <div class="sheet-body">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <span style="font-size:1.2rem;font-weight:800;">New Recipe</span>
        <button class="sheet-close" onclick="closeModal('addModal')">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label">Recipe name</label>
        <input class="form-input" id="newName" placeholder="e.g. Lemon Pasta" />
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group">
          <label class="form-label">Prep time</label>
          <input class="form-input" id="newPrep" placeholder="e.g. 15 min" />
        </div>
        <div class="form-group">
          <label class="form-label">Cook time</label>
          <input class="form-input" id="newCook" placeholder="e.g. 20 min" />
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group">
          <label class="form-label">Servings</label>
          <input class="form-input" id="newServings" placeholder="e.g. 4" type="number" min="1" />
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="form-select" id="newCategory">
            <option>Breakfast</option>
            <option>Lunch</option>
            <option>Dinner</option>
            <option>Dessert</option>
            <option>Snack</option>
            <option>Drink</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Emoji icon</label>
        <input class="form-input" id="newEmoji" placeholder="e.g. 🍝" maxlength="4" />
      </div>
      <div class="form-group">
        <label class="form-label">Ingredients (one per line, amount • name)</label>
        <textarea class="form-textarea" id="newIngredients" rows="4" placeholder="2 cups • flour&#10;1 tsp • salt&#10;3 • eggs"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Steps (one per line)</label>
        <textarea class="form-textarea" id="newSteps" rows="5" placeholder="Preheat oven to 350°F&#10;Mix dry ingredients&#10;Add wet ingredients and stir"></textarea>
      </div>
      <button class="btn-submit" onclick="saveRecipe()">Save Recipe</button>
    </div>
  </div>
</div>

<script>
  // ── Data ────────────────────────────────────────────────
  const STORAGE_KEY = 'myRecipeBook_v1';

  const placeholders = [
    {
      id: 1,
      name: "Creamy Garlic Pasta",
      emoji: "🍝",
      category: "Dinner",
      prepTime: "10 min",
      cookTime: "20 min",
      servings: 4,
      favorite: false,
      ingredients: [
        { amount: "400 g",   name: "spaghetti" },
        { amount: "6 cloves", name: "garlic, minced" },
        { amount: "1 cup",   name: "heavy cream" },
        { amount: "½ cup",   name: "Parmesan, grated" },
        { amount: "2 tbsp",  name: "butter" },
        { amount: "2 tbsp",  name: "olive oil" },
        { amount: "to taste", name: "salt & black pepper" },
        { amount: "handful", name: "fresh parsley, chopped" }
      ],
      steps: [
        "Bring a large pot of salted water to a boil. Cook spaghetti until al dente, reserving 1 cup of pasta water before draining.",
        "In a wide skillet, heat olive oil and butter over medium heat. Add garlic and sauté for 90 seconds until fragrant — don't let it brown.",
        "Pour in the heavy cream and stir. Simmer gently for 3 minutes until slightly thickened.",
        "Add the drained pasta to the pan. Toss to coat, adding pasta water a splash at a time to loosen the sauce.",
        "Remove from heat and stir in Parmesan. Season generously with salt and pepper.",
        "Plate and top with fresh parsley and extra Parmesan. Serve immediately."
      ]
    },
    {
      id: 2,
      name: "Blueberry Lemon Muffins",
      emoji: "🫐",
      category: "Breakfast",
      prepTime: "15 min",
      cookTime: "22 min",
      servings: 12,
      favorite: false,
      ingredients: [
        { amount: "2 cups",  name: "all-purpose flour" },
        { amount: "¾ cup",  name: "granulated sugar" },
        { amount: "2 tsp",  name: "baking powder" },
        { amount: "¼ tsp",  name: "salt" },
        { amount: "2",      name: "large eggs" },
        { amount: "½ cup",  name: "unsalted butter, melted" },
        { amount: "¾ cup",  name: "whole milk" },
        { amount: "1 tsp",  name: "vanilla extract" },
        { amount: "1",      name: "lemon, zested" },
        { amount: "1½ cups", name: "fresh blueberries" }
      ],
      steps: [
        "Preheat oven to 375 °F (190 °C). Line a 12-cup muffin tin with paper liners.",
        "In a large bowl whisk together flour, sugar, baking powder, and salt.",
        "In a separate bowl beat eggs, then whisk in melted butter, milk, vanilla, and lemon zest.",
        "Pour the wet ingredients into the dry. Stir gently until just combined — lumps are fine, don't overmix.",
        "Fold in blueberries with a spatula. Divide batter evenly among the muffin cups, filling each ¾ full.",
        "Bake 20–22 minutes until a toothpick inserted in the centre comes out clean and tops are golden.",
        "Cool in the tin for 5 minutes, then transfer to a wire rack. Best enjoyed warm!"
      ]
    }
  ];

  function loadRecipes() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      return stored ? JSON.parse(stored) : placeholders;
    } catch { return placeholders; }
  }

  function saveRecipes(recipes) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
  }

  let recipes = loadRecipes();
  let activeCategory = 'All';
  let activeTab = 'home';

  // ── Categories ───────────────────────────────────────────
  function getCategories() {
    const cats = ['All', ...new Set(recipes.map(r => r.category))];
    return cats;
  }

  function renderCats() {
    const bar = document.getElementById('catBar');
    bar.innerHTML = getCategories().map(c =>
      `<div class="cat-pill ${c === activeCategory ? 'active' : ''}" onclick="filterCat('${c}')">${c}</div>`
    ).join('');
  }

  function filterCat(cat) {
    activeCategory = cat;
    renderCats();
    renderRecipes();
  }

  // ── Recipe grid ──────────────────────────────────────────
  function renderRecipes() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const grid = document.getElementById('recipeGrid');
    const title = document.getElementById('sectionTitle');
    const count = document.getElementById('sectionCount');

    let filtered = recipes;
    if (activeTab === 'favs') filtered = recipes.filter(r => r.favorite);
    if (activeCategory !== 'All') filtered = filtered.filter(r => r.category === activeCategory);
    if (query) filtered = filtered.filter(r =>
      r.name.toLowerCase().includes(query) ||
      r.category.toLowerCase().includes(query)
    );

    title.textContent = activeTab === 'favs' ? 'Favorites' : activeCategory === 'All' ? 'All Recipes' : activeCategory;
    count.textContent = `${filtered.length} recipe${filtered.length !== 1 ? 's' : ''}`;

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">🍽️</div>
        <div class="empty-title">No recipes found</div>
        <div class="empty-sub">Try a different search or add a new recipe.</div>
      </div>`;
      return;
    }

    grid.innerHTML = filtered.map(r => `
      <div class="recipe-card" onclick="openDetail(${r.id})">
        <div class="card-img">${r.emoji}</div>
        <div class="card-body">
          <button class="fav-btn" onclick="toggleFav(event,${r.id})">${r.favorite ? '❤️' : '🤍'}</button>
          <div class="card-title">${r.name}</div>
          <div class="card-meta">
            <span class="card-time">⏱ ${r.cookTime}</span>
            <span class="card-tag">${r.category}</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  // ── Favorites ────────────────────────────────────────────
  function toggleFav(e, id) {
    e.stopPropagation();
    const r = recipes.find(r => r.id === id);
    if (r) { r.favorite = !r.favorite; saveRecipes(recipes); renderRecipes(); }
  }

  // ── Detail sheet ─────────────────────────────────────────
  function openDetail(id) {
    const r = recipes.find(r => r.id === id);
    if (!r) return;
    const sheet = document.getElementById('detailSheet');
    sheet.innerHTML = `
      <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
      <div class="sheet-hero">${r.emoji}</div>
      <div class="sheet-body">
        <div class="sheet-header">
          <span class="sheet-title">${r.name}</span>
          <button class="sheet-close" onclick="closeModal('detailModal')">✕</button>
        </div>
        <div class="sheet-tags">
          <span class="sheet-tag">${r.category}</span>
        </div>
        <div class="sheet-stats">
          <div class="stat-box">
            <div class="stat-value">${r.prepTime}</div>
            <div class="stat-label">Prep</div>
          </div>
          <div class="stat-box">
            <div class="stat-value">${r.cookTime}</div>
            <div class="stat-label">Cook</div>
          </div>
          <div class="stat-box">
            <div class="stat-value">${r.servings}</div>
            <div class="stat-label">Servings</div>
          </div>
        </div>
        <h3 class="section-h">Ingredients</h3>
        <ul class="ingredients">
          ${r.ingredients.map(i => `
            <li>
              <div class="ing-dot"></div>
              <span class="ing-amount">${i.amount}</span>
              <span>${i.name}</span>
            </li>`).join('')}
        </ul>
        <h3 class="section-h">Instructions</h3>
        <ol class="steps">
          ${r.steps.map((s,i) => `
            <li>
              <div class="step-num">${i+1}</div>
              <span>${s}</span>
            </li>`).join('')}
        </ol>
        <button class="btn-submit" onclick="toggleFav(event,${r.id});closeModal('detailModal')">
          ${r.favorite ? '❤️ Saved to Favorites' : '🤍 Save to Favorites'}
        </button>
      </div>
    `;
    document.getElementById('detailModal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  // ── Add recipe ───────────────────────────────────────────
  function openAdd() {
    document.getElementById('addModal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function saveRecipe() {
    const name = document.getElementById('newName').value.trim();
    if (!name) { alert('Please enter a recipe name.'); return; }

    const rawIngs = document.getElementById('newIngredients').value.trim();
    const rawSteps = document.getElementById('newSteps').value.trim();

    const ingredients = rawIngs
      ? rawIngs.split('\n').filter(Boolean).map(line => {
          const [amount, ...rest] = line.split('•');
          return rest.length ? { amount: amount.trim(), name: rest.join('•').trim() } : { amount: '', name: line.trim() };
        })
      : [];

    const steps = rawSteps ? rawSteps.split('\n').filter(Boolean) : [];

    const newId = Date.now();
    recipes.push({
      id: newId,
      name,
      emoji: document.getElementById('newEmoji').value || '🍽️',
      category: document.getElementById('newCategory').value,
      prepTime: document.getElementById('newPrep').value || '—',
      cookTime: document.getElementById('newCook').value || '—',
      servings: parseInt(document.getElementById('newServings').value) || 1,
      favorite: false,
      ingredients,
      steps
    });

    saveRecipes(recipes);
    closeModal('addModal');
    activeCategory = 'All';
    renderCats();
    renderRecipes();

    ['newName','newPrep','newCook','newServings','newEmoji','newIngredients','newSteps']
      .forEach(id => document.getElementById(id).value = '');
  }

  // ── Modals ───────────────────────────────────────────────
  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
    document.body.style.overflow = '';
  }

  function handleOverlayClick(e, id) {
    if (e.target.classList.contains('modal-overlay')) closeModal(id);
  }

  // ── Tab switching ─────────────────────────────────────────
  function switchTab(tab, el) {
    activeTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');

    const main = document.getElementById('mainContent');
    if (tab === 'shopping') {
      main.innerHTML = `
        <div style="text-align:center;padding:60px 24px;color:var(--subtext)">
          <div style="font-size:3rem;margin-bottom:12px">🛒</div>
          <div style="font-size:1rem;font-weight:700;color:var(--text);margin-bottom:6px">Shopping List</div>
          <div style="font-size:.87rem">Open a recipe and save its ingredients here — coming soon!</div>
        </div>`;
      return;
    }
    if (tab === 'settings') {
      main.innerHTML = `
        <div style="padding:20px 0">
          <div style="font-size:1.1rem;font-weight:700;margin-bottom:20px">Settings</div>
          <div style="background:var(--card-bg);border-radius:16px;overflow:hidden">
            ${['Export Recipes','Import Recipes','Clear All Data','About'].map((item,i,arr) => `
              <div style="padding:15px 16px;display:flex;justify-content:space-between;align-items:center;
                border-bottom:${i<arr.length-1?'1px solid var(--border)':'none'};cursor:pointer">
                <span style="font-size:.95rem">${item}</span>
                <span style="color:var(--subtext)">›</span>
              </div>`).join('')}
          </div>
          <div style="text-align:center;margin-top:32px;color:var(--subtext);font-size:.8rem">
            My Recipe Book • v1.0
          </div>
        </div>`;
      return;
    }
    main.innerHTML = `
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="searchInput" type="search" placeholder="Search recipes…" oninput="renderRecipes()" />
      </div>
      <div class="cats" id="catBar"></div>
      <div class="section-header">
        <span class="section-title" id="sectionTitle">All Recipes</span>
        <span class="section-count" id="sectionCount"></span>
      </div>
      <div class="recipe-grid" id="recipeGrid"></div>
    `;
    activeCategory = 'All';
    renderCats();
    renderRecipes();
  }

  // ── Init ─────────────────────────────────────────────────
  renderCats();
  renderRecipes();
</script>
</body>
</html>
