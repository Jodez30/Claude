name: Deploy No Fun Allowed to Pages

# OPTIONAL. You only need this workflow if you set
#   Settings → Pages → Source: "GitHub Actions".
# If you use Source: "Deploy from a branch" instead (simpler, and the
# recommended setup for this repo), GitHub serves index.html straight from the
# branch and this workflow is not involved at all.
#
# It is manual-only on purpose: Pages has to be switched on in Settings first,
# and a push-triggered run would just fail red until then. Once Pages is on,
# run it from the Actions tab, or add a `push:` trigger here.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a run that is already publishing; queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # index.html is the whole app, so the site is that one file served as
      # both the index and the 404 fallback. Nothing else in the repo ships.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp index.html _site/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
