<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050B14" />
  <meta name="robots" content="noindex" />
  <title>Sleeper Diagnostics · No Fun Allowed</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050B14'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle'%3E%F0%9F%A9%BA%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #050B14; --surface: #0D1B2C; --line: #22405E; --text: #F2F7FC;
      --muted: #8CA5BF; --gold: #FFC629; --red: #FF5A5A; --green: #37D67A;
      --safe-top: env(safe-area-inset-top, 0px); --safe-bot: env(safe-area-inset-bottom, 0px);
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text); min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      padding: calc(var(--safe-top) + 18px) 14px calc(var(--safe-bot) + 24px);
      -webkit-text-size-adjust: 100%;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.3rem; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 0.88rem; margin: 6px 0 16px; line-height: 1.5; }
    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 6px; padding: 12px; margin-bottom: 10px;
    }
    .row { display: flex; align-items: baseline; gap: 8px; }
    .mark { flex: none; font-weight: 700; width: 1.2em; }
    .ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--gold); }
    .label { font-weight: 600; font-size: 0.94rem; word-break: break-all; }
    .detail {
      margin-top: 7px; font-size: 0.82rem; color: var(--muted); line-height: 1.5;
      white-space: pre-wrap; word-break: break-word;
    }
    pre {
      margin-top: 8px; background: #071320; border: 1px solid var(--line); border-radius: 4px;
      padding: 9px; overflow-x: auto; font-size: 0.72rem; color: #B9CCE0; line-height: 1.45;
      max-height: 220px; overflow-y: auto;
    }
    .verdict { border-left: 4px solid var(--gold); }
    .verdict h2 { font-size: 1rem; margin-bottom: 7px; }
    button, .btn {
      display: inline-block; appearance: none; cursor: pointer;
      background: #16283E; border: 1px solid var(--line); border-radius: 5px;
      color: var(--text); font: inherit; font-size: 0.9rem; font-weight: 600;
      padding: 10px 14px; margin: 4px 6px 0 0; text-decoration: none;
    }
    label.idfield { display: block; margin: 12px 0 4px; font-size: 0.82rem; color: var(--muted); }
    input {
      width: 100%; background: #071320; border: 1px solid var(--line); border-radius: 5px;
      color: var(--text); font: inherit; font-size: 1rem; padding: 10px 12px;
    }
    code { color: var(--gold); font-size: 0.85em; }
  </style>
</head>
<body>
<main>
  <h1>Sleeper diagnostics</h1>
  <p class="sub">
    This runs the exact calls the app makes, from this browser, and reports what
    each one returns. It changes nothing. Screenshot the result if you want me to read it.
  </p>

  <label class="idfield" for="leagueId">League ID being tested</label>
  <input id="leagueId" inputmode="numeric" autocomplete="off" spellcheck="false" />
  <div>
    <button id="run">Run diagnostics</button>
    <button id="clearCache">Clear cached data</button>
    <a class="btn" href="./">Back to the hub</a>
  </div>

  <div id="out" style="margin-top:16px"></div>
</main>

<script src="config.js"></script>
<script>
(function () {
  'use strict';

  var BASE = 'https://api.sleeper.app/v1';
  var out = document.getElementById('out');
  var idInput = document.getElementById('leagueId');
  idInput.value = (window.LEAGUE_CONFIG && window.LEAGUE_CONFIG.sleeperLeagueId) || '';

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function card(mark, markClass, label, detail, body) {
    var c = el('div', 'card');
    var row = el('div', 'row');
    row.appendChild(el('span', 'mark ' + markClass, mark));
    row.appendChild(el('span', 'label', label));
    c.appendChild(row);
    if (detail) c.appendChild(el('div', 'detail', detail));
    if (body != null) {
      var pre = el('pre');
      pre.textContent = typeof body === 'string' ? body : JSON.stringify(body, null, 2);
      c.appendChild(pre);
    }
    out.appendChild(c);
    return c;
  }

  /* Returns a plain description of what happened rather than throwing, so one
     failing call doesn't hide the results of the others. */
  function probe(path) {
    var url = BASE + path;
    var started = Date.now();
    return fetch(url, { headers: { accept: 'application/json' } })
      .then(function (res) {
        return res.text().then(function (text) {
          var parsed = null, isJson = true;
          try { parsed = JSON.parse(text); } catch (e) { isJson = false; }
          return {
            path: path, url: url, ms: Date.now() - started,
            status: res.status, ok: res.ok, isJson: isJson,
            body: isJson ? parsed : text.slice(0, 400)
          };
        });
      })
      .catch(function (err) {
        return {
          path: path, url: url, ms: Date.now() - started,
          status: 0, ok: false, networkError: String(err && err.message || err)
        };
      });
  }

  function summarize(r) {
    if (r.status === 0) return 'Network-level failure — the request never got an HTTP response.\n' + r.networkError;
    if (r.status === 404) return 'HTTP 404 in ' + r.ms + 'ms — Sleeper has no record of this.';
    if (r.status === 429) return 'HTTP 429 in ' + r.ms + 'ms — rate limited.';
    if (!r.ok) return 'HTTP ' + r.status + ' in ' + r.ms + 'ms.';
    if (r.body === null) return 'HTTP 200 in ' + r.ms + 'ms, but the body is literally null — how Sleeper reports an ID it does not know.';
    if (Array.isArray(r.body)) return 'HTTP 200 in ' + r.ms + 'ms — array of ' + r.body.length + ' item(s).';
    return 'HTTP 200 in ' + r.ms + 'ms.';
  }

  function mark(r) {
    if (r.ok && r.body !== null && !(Array.isArray(r.body) && !r.body.length)) return ['✓', 'ok'];
    if (r.ok) return ['!', 'warn'];
    return ['✗', 'bad'];
  }

  function preview(body) {
    if (body == null) return body;
    if (Array.isArray(body)) return body.slice(0, 2);
    return body;
  }

  function run() {
    out.innerHTML = '';
    var leagueId = idInput.value.trim();
    if (!leagueId) { card('✗', 'bad', 'No league ID entered', 'Type the ID into the field above and run again.'); return; }

    card('·', 'warn', 'Running…', 'Testing ' + BASE + ' with league ID ' + leagueId);

    // Step 1: reachability + the league itself.
    probe('/league/' + leagueId).then(function (league) {
      out.innerHTML = '';
      var m = mark(league);
      card(m[0], m[1], 'GET /league/' + leagueId, summarize(league), preview(league.body));

      if (league.status === 0) {
        card('✗', 'bad', 'Verdict: cannot reach Sleeper',
          'The browser could not complete the request at all. This is not a bad league ID.\n\n' +
          'Usual causes: no connection; a VPN, ad blocker or DNS filter blocking api.sleeper.app; ' +
          'a corporate or school network; or Sleeper being down. Try the same page on cellular ' +
          'data with any content blocker disabled.').className = 'card verdict';
        return;
      }
      if (!league.ok || league.body === null) {
        card('✗', 'bad', 'Verdict: the league ID is not recognised',
          'Sleeper answered, so the network is fine — it just has no league with this ID.\n\n' +
          'Sleeper issues a NEW league ID every season, so a 2025 ID will not work for 2026. ' +
          'Open the league in the Sleeper app or on sleeper.com and copy the number out of the ' +
          'URL: sleeper.com/leagues/<THIS NUMBER>/team').className = 'card verdict';
        return;
      }

      var body = league.body;
      card('i', 'ok', 'League found: ' + (body.name || '(unnamed)'),
        'season ' + body.season + ' · status ' + body.status + ' · ' +
        body.total_rosters + ' rosters\ndraft_id: ' + (body.draft_id || '(none)') +
        '\nprevious_league_id: ' + (body.previous_league_id || '(none)'));

      if (String(body.season) !== '2026') {
        card('!', 'warn', 'This league is for season ' + body.season + ', not 2026',
          'The hub asks Sleeper for this ID and labels whatever comes back as 2026. ' +
          'If your 2026 league is a different one, its ID is what belongs in config.js.');
      }
      if (!body.draft_id) {
        card('✗', 'bad', 'Verdict: this league has no draft attached',
          'Sleeper returned the league but draft_id is empty, so there is nothing to read picks from.')
          .className = 'card verdict';
        return;
      }

      // Step 2: everything the board needs.
      return Promise.all([
        probe('/league/' + leagueId + '/users'),
        probe('/league/' + leagueId + '/rosters'),
        probe('/draft/' + body.draft_id),
        probe('/draft/' + body.draft_id + '/picks')
      ]).then(function (rs) {
        rs.forEach(function (r) {
          var mk = mark(r);
          card(mk[0], mk[1], 'GET ' + r.path, summarize(r), preview(r.body));
        });

        var draft = rs[2], picks = rs[3];
        var n = Array.isArray(picks.body) ? picks.body.length : 0;

        if (!picks.ok) {
          card('✗', 'bad', 'Verdict: the picks call failed',
            'The league loads but ' + picks.path + ' returned HTTP ' + picks.status + '.')
            .className = 'card verdict';
        } else if (n === 0) {
          card('!', 'warn', 'Verdict: the league is fine, the draft has no picks',
            'Sleeper knows the league and the draft, but returned an empty pick list. ' +
            'Draft status is "' + (draft.body && draft.body.status) + '".\n\n' +
            'If that status is pre_draft the draft has not been run on Sleeper yet. If the ' +
            'draft really did happen, it may have been run as a different draft than the one ' +
            'league.draft_id points at.').className = 'card verdict';
        } else {
          card('✓', 'ok', 'Verdict: Sleeper is returning everything the hub needs',
            n + ' picks came back over ' + ((draft.body && draft.body.settings && draft.body.settings.rounds) || '?') +
            ' rounds. If the 2026 tab still looks wrong, it is a bug in the hub rather than the ' +
            'API — tap "Clear cached data" above, reload, and say what the tab shows.')
            .className = 'card verdict';
        }
      });
    });
  }

  document.getElementById('run').addEventListener('click', run);
  document.getElementById('clearCache').addEventListener('click', function () {
    var removed = 0;
    /* Both prefixes: the app was renamed part-way through, so the Sleeper
       cache and the draft-round override sit under different keys. */
    var PREFIXES = ['keeperhub.', 'nofunallowed.'];
    try {
      Object.keys(localStorage).forEach(function (k) {
        var mine = PREFIXES.some(function (p) { return k.indexOf(p) === 0; });
        if (mine) { localStorage.removeItem(k); removed++; }
      });
    } catch (e) { /* private mode */ }
    out.innerHTML = '';
    card('✓', 'ok', 'Cleared ' + removed + ' cached item(s)', 'Reload the hub to refetch from Sleeper.');
  });

  run();
})();
</script>
</body>
</html>
